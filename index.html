<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>可屯卡密式充值系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            overflow: hidden;
        }

        /* iframe样式 */
        #main-iframe {
            width: 100vw;
            height: 100vh;
            border: none;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1;
        }

    </style>
</head>
<body>
    <!-- 主要内容iframe -->
    <iframe id="main-iframe" src="https://987ai.vip" title="可屯卡密式充值系统"></iframe>

    <script>
        // 动态处理URL参数
        function updateIframeSrc() {
            const iframe = document.getElementById('main-iframe');
            const currentUrl = window.location.href;
            const baseUrl = 'https://987ai.vip';
            
            // 获取当前页面的路径和查询参数
            const urlPath = window.location.pathname;
            const urlSearch = window.location.search;
            
            // 构建新的iframe src
            let newSrc = baseUrl;
            
            // 如果有路径且不是根路径，添加路径
            if (urlPath && urlPath !== '/') {
                newSrc += urlPath;
            }
            
            // 如果有查询参数，添加查询参数
            if (urlSearch) {
                newSrc += urlSearch;
            }
            
            iframe.src = newSrc;
        }

        // 页面加载完成提示
        window.addEventListener('load', () => {
            updateIframeSrc();
            console.log('可屯式卡密自助充值系统加载完成');
        });
    </script>
</body>
</html>
